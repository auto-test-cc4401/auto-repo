name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The tool is run twice a year. A monthly build surfaces runtime drift
  # between semesters instead of on provisioning day, which is how v1 died.
  schedule:
    - cron: '0 6 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
